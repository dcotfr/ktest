registries:
  - name: pi_registry
    url: http://192.168.0.105:8081

brokers:
  - name: pi_broker
    description: Integration test broker on Pi
    bootstrap.servers: ${concat("192.168.0.105", ":", "9092")}
    registry: pi_registry
  - name: local_broker
    description: Local broker
    bootstrap.servers: 127.0.0.1:9092
    registry: pi_registry

environments:
  - name: pi
    description: Default environment for `pi_broker` broker
    options:
      autoPause: 25
    onStart: |
      KAFKA_PREFIX=""
      KAFKA_LOCAL_CONTEXT="pi_broker"
      KAFKA_CENTRAL_CONTEXT=KAFKA_LOCAL_CONTEXT
      info("On Start script !")
    onEnd: info("On End script !")
  - name: piTag
    description: Environment targeting `pi_broker` broker and filtering tests by tag1 & tag3
    options:
      backOffset: 100
      matrix: excel.xlsx
      report: junit.xml
      tags: tag1,tag3
    onStart: |
      KAFKA_PREFIX=""
      KAFKA_LOCAL_CONTEXT="pi_broker"
      KAFKA_CENTRAL_CONTEXT=KAFKA_LOCAL_CONTEXT
      info("On Start script !")
    onEnd: info("On End script !")
  - name: local
    description: Default environment for `local_broker` broker
    onStart: |
      KAFKA_PREFIX="local-"
      KAFKA_LOCAL_CONTEXT="local_broker"
      KAFKA_CENTRAL_CONTEXT="pi_broker"
